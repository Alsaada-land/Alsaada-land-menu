<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو السعادة لاند | الفخامة والتميز</title>
    <!-- خط Tajawal وتنسيقات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #141824;
            --card-border: #22293a;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
        }

        /* رأس الصفحة الفاخر */
        .hero {
            text-align: center;
            padding: 45px 20px 25px;
            background: radial-gradient(circle at top, #1e2638 0%, var(--bg-dark) 70%);
            border-bottom: 1px solid var(--card-border);
            position: relative;
        }

        .logo-badge {
            width: 75px;
            height: 75px;
            background: var(--gold-gradient);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #0a0c10;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.35);
            margin-bottom: 12px;
        }

        .hero h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* أدوات البحث والتصفية */
        .sticky-nav {
            position: sticky;
            top: 0;
            background: rgba(10, 12, 16, 0.92);
            backdrop-filter: blur(12px);
            z-index: 100;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        .search-box {
            position: relative;
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 25px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
        }

        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s;
        }

        .cat-btn.active {
            background: var(--gold-gradient);
            color: #0a0c10;
            font-weight: 700;
            border-color: transparent;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        /* شبكة الأصناف */
        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px 15px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: 0.3s;
        }

        .item-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .item-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
        }

        .item-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .item-price {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--gold);
        }

        .item-price span {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--gold-light);
        }

        .add-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .add-btn:hover, .add-btn:active {
            background: var(--gold-gradient);
            color: #0a0c10;
        }

        /* شريط السلة العائم */
        .cart-bar {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            max-width: 500px;
            margin: auto;
            background: #1a2234;
            border: 1px solid var(--gold);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            display: none;
        }

        .cart-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-badge {
            background: var(--gold-gradient);
            color: #0a0c10;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .cart-total {
            font-weight: 700;
            color: #fff;
        }

        .order-btn {
            background: #25d366;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="logo-badge"><i class="fa-solid fa-crown"></i></div>
        <h1>مطعم السعادة لاند</h1>
        <p>تجربة طعام فاخرة تجمع الأصالة والمذاق الرفيع</p>
    </header>

    <div class="sticky-nav">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن وجبتك المفضلة...">
        </div>
        <div class="categories-scroll" id="catContainer">
            <button class="cat-btn active" onclick="filterCategory('all')">الكل</button>
            <button class="cat-btn" onclick="filterCategory('grills')">المشاوي</button>
            <button class="cat-btn" onclick="filterCategory('oriental')">المأكولات الشرقية</button>
            <button class="cat-btn" onclick="filterCategory('shawarma')">الشاورما</button>
            <button class="cat-btn" onclick="filterCategory('western')">الغربي والبيتزا</button>
            <button class="cat-btn" onclick="filterCategory('appetizers')">المقبلات</button>
            <button class="cat-btn" onclick="filterCategory('desserts')">الحلويات والجاتوه</button>
            <button class="cat-btn" onclick="filterCategory('drinks')">المشروبات والكوكتيل</button>
            <button class="cat-btn" onclick="filterCategory('shisha')">الأراجيل والخدمات</button>
        </div>
    </div>

    <main class="container">
        <div class="menu-grid" id="menuGrid"></div>
    </main>

    <!-- شريط السلة السفلي -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-details">
            <div class="cart-badge" id="cartCount">0</div>
            <div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">المجموع الكلي</div>
                <div class="cart-total" id="cartTotal">0 ₪</div>
            </div>
        </div>
        <button class="order-btn" onclick="sendWhatsAppOrder()">
            <i class="fa-brands fa-whatsapp"></i> اطلب الآن
        </button>
    </div>

    <script>
        // مصفوفة الأصناف الخاصة بالسعادة لاند
        const menuItems = [
            // المشاوي
            { id: 1, name: "شيش طاووق فاخر", cat: "grills", price: 30, desc: "أسياخ دجاج متبلة بأشهى البهارات ومشوية على الفحم مع السيرفيس" },
            { id: 2, name: "كباب لحم بلدي", cat: "grills", price: 38, desc: "لحم طازج مفروم مع التوابل الخاصة مشوي على الفحم" },
            { id: 3, name: "مشاوي مشكل ملوكي", cat: "grills", price: 58, desc: "تشكيلة من الكباب، الشيش طاووق، وقطع اللحم المشوية مع المقبلات" },
            { id: 4, name: "ريش خروف متبلة", cat: "grills", price: 60, desc: "قطع ريش غنم طرية مشوية بإتقان مع صوصات خاصة" },

            // المأكولات الشرقية
            { id: 5, name: "فتة دجاج بالسمنة واللوز", cat: "oriental", price: 35, desc: "أرز مبهر مع الدجاج المحمر وخبز مقرمش ومكسرات" },
            { id: 6, name: "أرز قدرة باللحم البلدي", cat: "oriental", price: 48, desc: "أرز بالبهارات الفاخرة مع الحمص وحبات الثوم وقطع اللحم الطازجة" },
            { id: 7, name: "سنسار ولائم ملوكي", cat: "oriental", price: 99, desc: "وجبة عائلية فاخرة مشكلة من أشهى المأكولات الشرقية" },

            // الشاورما
            { id: 8, name: "ساندوتش شاورما دجاج (كبير)", cat: "shawarma", price: 12, desc: "شاورما دجاج مع المخلل والثومية بخبز الصاج أو الشراك" },
            { id: 9, name: "ساندوتش شاورما لحم (كبير)", cat: "shawarma", price: 16, desc: "لحم عجل متبل بالخلطة التركية مع صوص الطحينة" },
            { id: 10, name: "وجبة عربي شاورما دجاج دبل", cat: "shawarma", price: 26, desc: "مقطعة مع بطاطا مقلية وسرفيس وصوصات خاصة" },
            { id: 11, name: "سدر شاورما عائلي", cat: "shawarma", price: 95, desc: "سدر عائلي منوع لحم ودجاج مع تشكيلة كاملة من الصوصات" },

            // الغربي والبيتزا
            { id: 12, name: "بيتزا سوبريم إيطالية", cat: "western", price: 32, desc: "جبنة موزاريلا فاخرة مع تشكيلة خضار ولحوم وصوص خاص" },
            { id: 13, name: "برجر كلاسيك لحم آنجوس", cat: "western", price: 25, desc: "قطعة برجر مشوية مع الجبنة الذائبة وصوص البرجر الخاص" },
            { id: 14, name: "وجبة كرسبي زنجر حار", cat: "western", price: 28, desc: "قطع دجاج مقرمشة مع البطاطا المتبلة والمايونيز الحار" },
            { id: 15, name: "بيتزا فور تشيز حجم عائلي", cat: "western", price: 42, desc: "أربع أنواع من أشهى الأجبان الإيطالية الذائبة" },

            // المقبلات
            { id: 16, name: "حمص باللحمة والمكسرات", cat: "appetizers", price: 18, desc: "حمص ناعم بزيت الزيتون البكر مع قطع اللحم والصنوبر" },
            { id: 17, name: "متبل باذنجان مشوي", cat: "appetizers", price: 10, desc: "باذنجان مشوي على الفحم مع الطحينة وزيت الزيتون" },
            { id: 18, name: "بطاطا حارة بالأعشاب", cat: "appetizers", price: 12, desc: "مكعبات بطاطا مقرمشة مع الثوم والكزبرة والفلفل الحار" },

            // الحلويات
            { id: 19, name: "كنافة عربية بالمكسرات", cat: "desserts", price: 18, desc: "كنافة بالسمن البلدي محشوة بأجود أنواع المكسرات" },
            { id: 20, name: "كريب نوتيلا ملوكي مع الفواكه", cat: "desserts", price: 22, desc: "محشو بالنوتيلا الإيطالية وقطع الموز والفراولة" },
            { id: 21, name: "قالب كيك مناسبات فاخر", cat: "desserts", price: 120, desc: "كيك محشو بالكريمة والشوكولاتة البلجيكية حسب الطلب" },

            // المشروبات
            { id: 22, name: "موهيتو بلوبيري منعش", cat: "drinks", price: 14, desc: "سيرب توت أزرق مع أوراق النعناع والليمون والصودا" },
            { id: 23, name: "عصير أفوكادو بالمكسرات والعسل", cat: "drinks", price: 16, desc: "أفوكادو طازج مع القشطة والمكسرات والعسل الطبيعي" },
            { id: 24, name: "ميلك شيك لوتس / أوريو", cat: "drinks", price: 15, desc: "مخفوق الحليب والآيس كريم مع بسكويت اللوتس المقرمش" },

            // الأراجيل والخدمات
            { id: 25, name: "أرجيلة تفاحتين نخيل فاخر", cat: "shisha", price: 15, desc: "معسل أصلي مع خدمة تبديل الفحم المستمرة" },
            { id: 26, name: "أرجيلة ليمون ونعناع ممتازة", cat: "shisha", price: 15, desc: "طعم منعش ومميز بجودة عالية" }
        ];

        let cart = {};

        // عرض الأصناف
        function renderMenu(items) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            
            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">لا توجد أصناف مطابقة للبحث</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div>
                        <div class="item-header">
                            <div class="item-title">${item.name}</div>
                        </div>
                        <div class="item-desc">${item.desc}</div>
                    </div>
                    <div class="item-footer">
                        <div class="item-price">${item.price} <span>₪</span></div>
                        <button class="add-btn" onclick="addToCart(${item.id})">
                            <i class="fa-solid fa-plus"></i> إضافة
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // تصفية الأقسام
        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (cat === 'all') {
                renderMenu(menuItems);
            } else {
                const filtered = menuItems.filter(item => item.cat === cat);
                renderMenu(filtered);
            }
        }

        // البحث
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = menuItems.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.desc.toLowerCase().includes(query)
            );
            renderMenu(filtered);
        });

        // إدارة السلة
        function addToCart(id) {
            const item = menuItems.find(i => i.id === id);
            if (cart[id]) {
                cart[id].qty++;
            } else {
                cart[id] = { ...item, qty: 1 };
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cartBar');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');
            
            let totalQty = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                totalQty += item.qty;
                totalPrice += item.price * item.qty;
            });

            if (totalQty > 0) {
                cartBar.style.display = 'flex';
                cartCount.innerText = totalQty;
                cartTotal.innerText = `${totalPrice} ₪`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        // إرسال الطلب للواتساب
        function sendWhatsAppOrder() {
            let message = "مرحباً، أود تقديم طلب جديد من منيو السعادة لاند:\n\n";
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                message += `- ${item.name} (${item.qty}x) = ${item.price * item.qty} ₪\n`;
                totalPrice += item.price * item.qty;
            });

            message += `\n*الإجمالي: ${totalPrice} ₪*`;

            const phone = "972590000000"; // يمكنك استبداله برقم المطعم المعتمد
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        // البدء بالتحميل
        renderMenu(menuItems);
    </script>
</body>
</html>
