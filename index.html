<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو السعادة لاند | الفخامة والتميز</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #141824;
            --card-border: #22293a;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 50px; }
        
        /* زر الأدمن */
        .admin-trigger { position: absolute; top: 15px; left: 15px; background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: var(--gold); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 200; transition: 0.3s; }
        .admin-trigger:hover { background: var(--gold); color: #0a0c10; }

        .hero { text-align: center; padding: 45px 20px 25px; background: radial-gradient(circle at top, #1e2638 0%, var(--bg-dark) 70%); border-bottom: 1px solid var(--card-border); position: relative; }
        .logo-badge { width: 75px; height: 75px; background: var(--gold-gradient); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; color: #0a0c10; box-shadow: 0 0 25px rgba(212, 175, 55, 0.35); margin-bottom: 12px; overflow: hidden; padding: 0; }
        .logo-badge img { width: 100%; height: 100%; object-fit: cover; }
        
        .hero h1 { font-size: 1.8rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .hero p { color: var(--text-muted); font-size: 0.95rem; }
        
        .sticky-nav { position: sticky; top: 0; background: rgba(10, 12, 16, 0.92); backdrop-filter: blur(12px); z-index: 100; padding: 12px 15px; border-bottom: 1px solid rgba(212, 175, 55, 0.15); }
        .search-box { position: relative; margin-bottom: 10px; }
        .search-box input { width: 100%; padding: 10px 40px 10px 15px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 25px; color: #fff; font-size: 0.9rem; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); }
        
        .categories-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 7px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; white-space: nowrap; cursor: pointer; transition: 0.3s; }
        .cat-btn.active { background: var(--gold-gradient); color: #0a0c10; font-weight: 700; border-color: transparent; box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3); }
        
        .container { max-width: 900px; margin: auto; padding: 20px 15px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .item-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        .item-card:hover { border-color: rgba(212, 175, 55, 0.4); transform: translateY(-2px); }
        
        .item-img-container { width: 100%; height: 160px; overflow: hidden; position: relative; background: #1a2234; display: flex; align-items: center; justify-content: center; }
        .item-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s ease; }
        
        .item-content-body { padding: 14px 16px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .item-title { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .item-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 15px; }
        .item-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .item-price { font-size: 1.2rem; font-weight: 900; color: var(--gold); }
        .item-price span { font-size: 0.85rem; font-weight: 500; color: var(--gold-light); }

        /* لوحة التحكم والأدمن */
        .admin-input { width: 100%; padding: 8px 12px; background: #0a0c10; border: 1px solid var(--card-border); border-radius: 8px; color: #fff; font-size: 0.9rem; margin-bottom: 8px; outline: none; }
        .admin-input:focus { border-color: var(--gold); }
        .btn-edit { background: #25d366; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.8rem; flex: 1; }
        .btn-delete { background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.8rem; }
        .admin-section-box { background: var(--card-bg); border: 2px dashed var(--gold); padding: 15px; border-radius: 16px; margin-bottom: 20px; display: none; }
        
        .img-adjuster { background: #0d1117; padding: 8px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--card-border); font-size: 0.8rem; color: var(--text-muted); }
        .img-adjuster label { display: block; margin-bottom: 2px; color: var(--gold-light); }
        .img-adjuster input[type="range"] { width: 100%; accent-color: var(--gold); }

        /* نافذة الترحيب الأسطورية لزكريا */
        #welcomePopup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 12, 16, 0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 9999; animation: fadeIn 0.3s ease; }
        .welcome-card { background: var(--card-bg); border: 2px solid var(--gold); padding: 30px; border-radius: 20px; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 0 40px rgba(212, 175, 55, 0.3); }
        .welcome-card h2 { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.5rem; margin-bottom: 12px; }
        .welcome-card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <!-- نافذة الترحيب بـ زكريا -->
    <div id="welcomePopup">
        <div class="welcome-card">
            <div style="font-size: 2.5rem; color: var(--gold); margin-bottom: 10px;"><i class="fa-solid fa-crown"></i></div>
            <h2 id="welcomeTitle">أهلاً بك يا زكريا</h2>
            <p id="welcomeMsg">بطل الإنجاز والابداع.. عقول العظماء تصنع الفخامة. نتمنى لك يوماً مليئاً بالنجاح والسعادة والبركة!</p>
        </div>
    </div>

    <header class="hero">
        <div class="admin-trigger" onclick="checkAdminLogin()" title="لوحة التحكم">
            <i class="fa-solid fa-lock" id="lockIcon"></i>
        </div>
        <div class="logo-badge">
            <img src="logo.jpg" alt="شعار السعادة لاند">
        </div>
        <h1>مطعم السعادة لاند</h1>
        <p>تجربة طعام فاخرة تجمع الأصالة والمذاق الرفيع</p>
    </header>

    <main class="container">
        <!-- إدارة القوائم (إضافة قائمة جديدة) - تظهر فقط للأدمن -->
        <div class="admin-section-box" id="addCategorySection">
            <h3 style="color: var(--gold); margin-bottom: 10px;"><i class="fa-solid fa-folder-plus"></i> إضافة قسم (قائمة) جديدة</h3>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="newCatKey" class="admin-input" placeholder="اسم البرمجة للانجليزي (مثال: burgers)" style="margin-bottom:0;">
                <input type="text" id="newCatName" class="admin-input" placeholder="اسم القسم بالعربي (مثال: البرجر الفاخر)" style="margin-bottom:0;">
            </div>
            <button style="background: var(--gold-gradient); color: #0a0c10; font-weight: 700; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 10px;" onclick="addNewCategory()">إضافة القسم الجديد</button>
        </div>

        <!-- إضافة طبق جديد -->
        <div class="admin-section-box" id="addItemSection">
            <h3 style="color: var(--gold); margin-bottom: 10px;"><i class="fa-solid fa-plus-circle"></i> إضافة طبق جديد للقائمة</h3>
            <input type="text" id="newName" class="admin-input" placeholder="اسم الطبق">
            <input type="number" id="newPrice" class="admin-input" placeholder="السعر (₪)">
            <select id="newCat" class="admin-input">
                <!-- تعبئة الأقسام ديناميكياً -->
            </select>
            <input type="text" id="newDesc" class="admin-input" placeholder="وصف الطبق">
            
            <div style="margin-bottom: 8px;">
                <label style="font-size: 0.85rem; color: var(--gold);">اختر صورة الطبق الحقيقية:</label>
                <input type="file" id="newImageFile" class="admin-input" accept="image/*" onchange="compressAndPreview(event, 'new')">
            </div>
            
            <div style="text-align: center; margin-bottom: 10px; background: #0a0c10; padding: 10px; border-radius: 8px;">
                <div style="width: 100px; height: 100px; margin: auto; overflow: hidden; border-radius: 12px; border: 2px solid var(--gold); position: relative; background: #141824;">
                    <img id="newImgPreview" src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
            </div>

            <button style="background: var(--gold-gradient); color: #0a0c10; font-weight: 700; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer;" onclick="addNewItem()">إضافة الطبق للقائمة</button>
        </div>

        <div class="sticky-nav" style="border-radius: 15px; margin-bottom: 20px;">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن وجبتك المفضلة...">
            </div>
            <div class="categories-scroll" id="catContainer">
                <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
            </div>
        </div>

        <div class="menu-grid" id="menuGrid">
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">جاري تحميل الأصناف السحابية...</div>
        </div>
    </main>

    <!-- جافاسكريبت وربط Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA0P7gSQu2rl5ZWwcXPrHedsL2OfmY3Cdk",
          authDomain: "alsaada-menu.firebaseapp.com",
          projectId: "alsaada-menu",
          storageBucket: "alsaada-menu.firebasestorage.app",
          messagingSenderId: "632486772624",
          appId: "1:632486772624:web:751938c5b1914cc8e2fd15",
          measurementId: "G-5NRCS5NN6N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let menuItems = [];
        let categories = {
            'shawarma': 'الشاورما',
            'oriental': 'المأكولات الشرقية',
            'western': 'الوجبات الغربية',
            'bbq': 'وجبات المشاوي',
            'appetizers': 'المقبلات والصلصات',
            'pizza': 'بيتزا وكالزوني',
            'desserts': 'الحلويات',
            'drinks': 'المشروبات'
        };
        let isAdminLoggedIn = false;
        let newOptimizedImage = "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500";

        // عبارات ترحيبية أسطورية ومحفزة لاسم زكريا
        const zekoMessages = [
            "مرحباً بك يا زكريا.. يا بطل الإنجاز والتميز، عقول العظماء وحدها تصنع الفخامة. نتمنى لك يوماً مليئاً بالنجاح والسعادة!",
            "أهلاً بالقائد زكريا! خطوتك اليوم تفتح أبواباً جديدة للإبداع والنجاح. دام وجهك مفعماً بالسعادة والتوفيق!",
            "يا هلا بزكريا الفنان! مطعم السعادة لاند ينير بوجودك. دمت مبدعاً ومحلقاً في سماء التميز والرخاء.",
            "مرحباً زكريا الحبيب.. كل شيء يتحول إلى تحفة فنية تحت إشرافك. نهارك سعيد ومليء بالطاقة الإيجابية!"
        ];

        // ضغط عالي الجودة للصور
        window.compressAndPreview = function(event, targetId) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // دقة عالية جداً وواضحة للزبون
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

                    if (targetId === 'new') {
                        newOptimizedImage = compressedDataUrl;
                        document.getElementById('newImgPreview').src = compressedDataUrl;
                    } else {
                        tempUpdatedImages[targetId] = compressedDataUrl;
                        document.getElementById(`img_view_${targetId}`).src = compressedDataUrl;
                    }
                }
            }
            reader.readAsDataURL(file);
        }

        window.checkAdminLogin = function() {
            if (isAdminLoggedIn) {
                if (confirm("هل تريد تسجيل الخروج من لوحة التحكم؟")) {
                    isAdminLoggedIn = false;
                    document.getElementById('addItemSection').style.display = 'none';
                    document.getElementById('addCategorySection').style.display = 'none';
                    document.getElementById('lockIcon').className = "fa-solid fa-lock";
                    renderMenu(menuItems);
                    renderCategories();
                }
                return;
            }

            let u = prompt("أدخل اسم المستخدم (Username):");
            if (u !== "zeko") { if (u !== null) alert("اسم المستخدم خطأ!"); return; }
            let p = prompt("أدخل كلمة المرور (Password):");
            if (p === "zeko@2001") {
                isAdminLoggedIn = true;
                document.getElementById('addItemSection').style.display = 'block';
                document.getElementById('addCategorySection').style.display = 'block';
                document.getElementById('lockIcon').className = "fa-solid fa-unlock-keyhole";
                
                // إظهار رسالة الترحيب الأسطورية لزكريا لمدة 3 ثواني
                let randomMsg = zekoMessages[Math.floor(Math.random() * zekoMessages.length)];
                document.getElementById('welcomeMsg').innerText = randomMsg;
                let popup = document.getElementById('welcomePopup');
                popup.style.display = 'flex';
                setTimeout(() => {
                    popup.style.display = 'none';
                }, 3300); // تختفي بعد 3.3 ثانية

                renderMenu(menuItems);
                renderCategories();
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        async function loadMenuFromCloud() {
            try {
                const querySnapshot = await getDocs(collection(db, "menu"));
                menuItems = [];
                querySnapshot.forEach((docSnap) => {
                    menuItems.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderMenu(menuItems);
                renderCategories();
            } catch (error) {
                console.error(error);
            }
        }

        // رسم الأقسام والقوائم
        window.renderCategories = function() {
            const container = document.getElementById('catContainer');
            const selectEl = document.getElementById('newCat');
            
            container.innerHTML = `<button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>`;
            if(selectEl) selectEl.innerHTML = '';

            for (let key in categories) {
                let name = categories[key];
                
                // زر التصنيف للزباين
                let btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.setAttribute('onclick', `filterCategory('${key}', this)`);
                
                if(isAdminLoggedIn) {
                    btn.innerHTML = `${name} <span onclick="event.stopPropagation(); editCategoryKey('${key}')" style="color:var(--gold); margin-right:5px;" title="تعديل اسم القسم">✏️</span> <span onclick="event.stopPropagation(); deleteCategoryKey('${key}')" style="color:#e74c3c; margin-right:3px;" title="حذف القسم">🗑️</span>`;
                } else {
                    btn.innerText = name;
                }
                container.appendChild(btn);

                // خيارات القائمة لربط صنف جديد
                if(selectEl) {
                    let opt = document.createElement('option');
                    opt.value = key;
                    opt.innerText = name;
                    selectEl.appendChild(opt);
                }
            }
        }

        // إضافة قسم جديد
        window.addNewCategory = function() {
            let key = document.getElementById('newCatKey').value.trim().toLowerCase();
            let name = document.getElementById('newCatName').value.trim();
            if(!key || !name) { alert("الرجاء إدخال اسم القسم بالعربي والإنجليزية!"); return; }
            if(categories[key]) { alert("هذا القسم موجود مسبقاً!"); return; }

            categories[key] = name;
            alert("تمت إضافة القسم بنجاح!");
            document.getElementById('newCatKey').value = '';
            document.getElementById('newCatName').value = '';
            renderCategories();
        }

        // تعديل اسم القسم
        window.editCategoryKey = function(key) {
            let newName = prompt("أدخل الاسم الجديد للقسم:", categories[key]);
            if(newName) {
                categories[key] = newName;
                renderCategories();
                alert("تم تعديل اسم القسم بنجاح!");
            }
        }

        // حذف القسم
        window.deleteCategoryKey = function(key) {
            if(confirm(`هل أنت متأكد من حذف قسم (${categories[key]})؟`)) {
                delete categories[key];
                renderCategories();
                alert("تم حذف القسم بنجاح!");
            }
        }

        window.renderMenu = function(items) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">لا توجد أصناف متاحة حالياً</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';

                let zoomVal = item.zoom || 1;
                let posXVal = item.posX || 0;
                let posYVal = item.posY || 0;

                let adminControlsHTML = '';
                if (isAdminLoggedIn) {
                    let catOptions = '';
                    for(let k in categories) {
                        catOptions += `<option value="${k}" ${item.cat === k ? 'selected' : ''}>${categories[k]}</option>`;
                    }

                    adminControlsHTML = `
                        <div style="background: #1a2234; padding: 12px; border-top: 1px solid var(--card-border); margin-top: 10px;">
                            <input type="text" id="name_${item.id}" class="admin-input" value="${item.name}" placeholder="الاسم">
                            <input type="number" id="price_${item.id}" class="admin-input" value="${item.price}" placeholder="السعر">
                            <select id="cat_${item.id}" class="admin-input">${catOptions}</select>
                            
                            <div style="margin-bottom: 8px;">
                                <label style="font-size:0.75rem; color:var(--gold);">تغيير صورة الطبق:</label>
                                <input type="file" id="file_${item.id}" class="admin-input" accept="image/*" onchange="compressAndPreview(event, '${item.id}')">
                            </div>

                            <div class="img-adjuster">
                                <label>تكبير/تصغير الصورة (Zoom): <span id="zoom_val_${item.id}">${zoomVal}</span></label>
                                <input type="range" min="1" max="2.5" step="0.1" value="${zoomVal}" oninput="adjustImageProp('${item.id}', 'zoom', this.value)">
                                
                                <label style="margin-top: 5px;">تحريك أفقي (يمين/يسار):</label>
                                <input type="range" min="-100" max="100" value="${posXVal}" oninput="adjustImageProp('${item.id}', 'x', this.value)">

                                <label style="margin-top: 5px;">تحريك عمودي (فوق/تحت):</label>
                                <input type="range" min="-100" max="100" value="${posYVal}" oninput="adjustImageProp('${item.id}', 'y', this.value)">
                            </div>

                            <div style="display: flex; gap: 5px; margin-top: 5px;">
                                <button class="btn-edit" onclick="updateItemData('${item.id}')"><i class="fa-solid fa-save"></i> حفظ</button>
                                <button class="btn-delete" onclick="deleteItem('${item.id}')"><i class="fa-solid fa-trash"></i> حذف</button>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="item-img-container">
                        <img id="img_view_${item.id}" src="${item.img || 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500'}" alt="${item.name}" class="item-img" style="transform: scale(${zoomVal}) translate(${posXVal}px, ${posYVal}px);">
                    </div>
                    <div class="item-content-body">
                        <div>
                            <div class="item-title">${item.name}</div>
                            <div class="item-desc">${item.desc || ''}</div>
                        </div>
                        <div class="item-footer">
                            <div class="item-price">${item.price} <span>₪</span></div>
                        </div>
                        ${adminControlsHTML}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.adjustImageProp = function(id, type, val) {
            let imgEl = document.getElementById(`img_view_${id}`);
            let item = menuItems.find(i => i.id === id);
            if(!item) return;

            if(type === 'zoom') item.zoom = Number(val);
            if(type === 'x') item.posX = Number(val);
            if(type === 'y') item.posY = Number(val);

            imgEl.style.transform = `scale(${item.zoom || 1}) translate(${item.posX || 0}px, ${item.posY || 0}px)`;
        }

        let tempUpdatedImages = {};
        window.updateItemData = async function(id) {
            let newName = document.getElementById(`name_${id}`).value;
            let newPrice = document.getElementById(`price_${id}`).value;
            let newCat = document.getElementById(`cat_${id}`).value;
            let item = menuItems.find(i => i.id === id);

            let updatePayload = {
                name: newName,
                price: Number(newPrice),
                cat: newCat,
                zoom: item.zoom || 1,
                posX: item.posX || 0,
                posY: item.posY || 0
            };

            if(tempUpdatedImages[id]) {
                updatePayload.img = tempUpdatedImages[id];
            }

            try {
                await updateDoc(doc(db, "menu", id), updatePayload);
                alert("تم الحفظ وتحديث البيانات للزبائن فوراً!");
                loadMenuFromCloud();
            } catch (err) {
                alert("حدث خطأ أثناء الحفظ");
            }
        }

        window.deleteItem = async function(id) {
            if (!confirm("هل أنت متأكد من حذف هذا الطبق؟")) return;
            try {
                await deleteDoc(doc(db, "menu", id));
                alert("تم الحذف بنجاح!");
                loadMenuFromCloud();
            } catch (err) {
                alert("خطأ أثناء الحذف");
            }
        }

        window.addNewItem = async function() {
            let name = document.getElementById('newName').value;
            let price = document.getElementById('newPrice').value;
            let cat = document.getElementById('newCat').value;
            let desc = document.getElementById('newDesc').value;
            
            if (!name || !price) { alert("الرجاء إدخال اسم الطبق والسعر على الأقل!"); return; }
            try {
                await addDoc(collection(db, "menu"), {
                    name,
                    price: Number(price),
                    cat,
                    desc,
                    img: newOptimizedImage,
                    zoom: 1,
                    posX: 0,
                    posY: 0
                });
                alert("تمت إضافة الطبق بنجاح!");
                document.getElementById('newName').value = '';
                document.getElementById('newPrice').value = '';
                document.getElementById('newDesc').value = '';
                loadMenuFromCloud();
            } catch (err) {
                alert("خطأ أثناء الإضافة");
            }
        }

        window.filterCategory = function(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (cat === 'all') {
                renderMenu(menuItems);
            } else {
                renderMenu(menuItems.filter(item => item.cat === cat));
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            renderMenu(menuItems.filter(item => item.name.toLowerCase().includes(query)));
        });

        loadMenuFromCloud();
    </script>
</body>
</html>
