<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو السعادة لاند | الفخامة والتميز</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #141824;
            --card-border: #22293a;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }
        .hero { text-align: center; padding: 45px 20px 25px; background: radial-gradient(circle at top, #1e2638 0%, var(--bg-dark) 70%); border-bottom: 1px solid var(--card-border); position: relative; }
        .logo-badge { width: 75px; height: 75px; background: var(--gold-gradient); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; color: #0a0c10; box-shadow: 0 0 25px rgba(212, 175, 55, 0.35); margin-bottom: 12px; }
        .hero h1 { font-size: 1.8rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .hero p { color: var(--text-muted); font-size: 0.95rem; }
        .sticky-nav { position: sticky; top: 0; background: rgba(10, 12, 16, 0.92); backdrop-filter: blur(12px); z-index: 100; padding: 12px 15px; border-bottom: 1px solid rgba(212, 175, 55, 0.15); }
        .search-box { position: relative; margin-bottom: 10px; }
        .search-box input { width: 100%; padding: 10px 40px 10px 15px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 25px; color: #fff; font-size: 0.9rem; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); }
        .categories-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 7px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; white-space: nowrap; cursor: pointer; transition: 0.3s; }
        .cat-btn.active { background: var(--gold-gradient); color: #0a0c10; font-weight: 700; border-color: transparent; box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3); }
        .container { max-width: 900px; margin: auto; padding: 20px 15px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .item-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        .item-card:hover { border-color: rgba(212, 175, 55, 0.4); transform: translateY(-2px); }
        .item-img-container { width: 100%; height: 150px; overflow: hidden; position: relative; background: #1a2234; }
        .item-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .item-content-body { padding: 14px 16px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .item-title { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .item-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 15px; }
        .item-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .item-price { font-size: 1.15rem; font-weight: 900; color: var(--gold); }
        .item-price span { font-size: 0.85rem; font-weight: 500; color: var(--gold-light); }
        .add-btn { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: var(--gold-light); padding: 6px 14px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .add-btn:hover { background: var(--gold-gradient); color: #0a0c10; }
        .cart-bar { position: fixed; bottom: 15px; left: 15px; right: 15px; max-width: 500px; margin: auto; background: #1a2234; border: 1px solid var(--gold); border-radius: 20px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); z-index: 1000; display: none; }
        .cart-details { display: flex; align-items: center; gap: 12px; }
        .cart-badge { background: var(--gold-gradient); color: #0a0c10; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        .cart-total { font-weight: 700; color: #fff; }
        .order-btn { background: #25d366; color: #fff; border: none; padding: 8px 18px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>

    <header class="hero">
        <div class="logo-badge"><i class="fa-solid fa-crown"></i></div>
        <h1>مطعم السعادة لاند</h1>
        <p>تجربة طعام فاخرة تجمع الأصالة والمذاق الرفيع</p>
    </header>

    <div class="sticky-nav">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن وجبتك المفضلة...">
        </div>
        <div class="categories-scroll" id="catContainer">
            <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
            <button class="cat-btn" onclick="filterCategory('shawarma', this)">الشاورما</button>
            <button class="cat-btn" onclick="filterCategory('oriental', this)">المأكولات الشرقية</button>
            <button class="cat-btn" onclick="filterCategory('western', this)">الوجبات الغربية</button>
            <button class="cat-btn" onclick="filterCategory('bbq', this)">وجبات المشاوي</button>
            <button class="cat-btn" onclick="filterCategory('appetizers', this)">المقبلات والصلصات</button>
            <button class="cat-btn" onclick="filterCategory('pizza', this)">البيتزا والكالزوني</button>
            <button class="cat-btn" onclick="filterCategory('desserts', this)">الحلويات والجاتوهات</button>
            <button class="cat-btn" onclick="filterCategory('drinks', this)">المشروبات</button>
        </div>
    </div>

    <main class="container">
        <div class="menu-grid" id="menuGrid">
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">جاري تحميل الأصناف السحابية...</div>
        </div>
    </main>

    <div class="cart-bar" id="cartBar">
        <div class="cart-details">
            <div class="cart-badge" id="cartCount">0</div>
            <div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">المجموع الكلي</div>
                <div class="cart-total" id="cartTotal">0 ₪</div>
            </div>
        </div>
        <button class="order-btn" onclick="sendWhatsAppOrder()">
            <i class="fa-brands fa-whatsapp"></i> اطلب الآن
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA0P7gSQu2rl5ZWwcXPrHedsL2OfmY3Cdk",
          authDomain: "alsaada-menu.firebaseapp.com",
          projectId: "alsaada-menu",
          storageBucket: "alsaada-menu.firebasestorage.app",
          messagingSenderId: "632486772624",
          appId: "1:632486772624:web:751938c5b1914cc8e2fd15",
          measurementId: "G-5NRCS5NN6N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let menuItems = [];
        let currentCategory = 'all';
        let cart = {};

        async function loadMenuFromCloud() {
            try {
                const querySnapshot = await getDocs(collection(db, "menu"));
                menuItems = [];
                querySnapshot.forEach((doc) => {
                    menuItems.push({ id: doc.id, ...doc.data() });
                });
                renderMenu(menuItems);
            } catch (error) {
                console.error("Error loading menu: ", error);
                document.getElementById('menuGrid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">خطأ في تحميل البيانات السحابية</div>';
            }
        }

        window.renderMenu = function(items) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            
            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">لا توجد أصناف مطابقة</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-img-container">
                        <img src="${item.img || 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500'}" alt="${item.name}" class="item-img" loading="lazy">
                    </div>
                    <div class="item-content-body">
                        <div>
                            <div class="item-title">${item.name}</div>
                            <div class="item-desc">${item.desc || ''}</div>
                        </div>
                        <div class="item-footer">
                            <div class="item-price">${item.price} <span>₪</span></div>
                            <button class="add-btn" onclick="window.addToCart('${item.id}')">
                                <i class="fa-solid fa-plus"></i> إضافة
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.filterCategory = function(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat;
            
            if (cat === 'all') {
                renderMenu(menuItems);
            } else {
                const filtered = menuItems.filter(item => item.cat === cat);
                renderMenu(filtered);
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = menuItems.filter(item => 
                (item.name && item.name.toLowerCase().includes(query)) || 
                (item.desc && item.desc.toLowerCase().includes(query))
            );
            renderMenu(filtered);
        });

        window.addToCart = function(id) {
            const item = menuItems.find(i => i.id == id);
            if (!item) return;
            if (cart[id]) {
                cart[id].qty++;
            } else {
                cart[id] = { ...item, qty: 1 };
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cartBar');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');
            
            let totalQty = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                totalQty += item.qty;
                totalPrice += Number(item.price) * item.qty;
            });

            if (totalQty > 0) {
                cartBar.style.display = 'flex';
                cartCount.innerText = totalQty;
                cartTotal.innerText = `${totalPrice} ₪`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        window.sendWhatsAppOrder = function() {
            let message = "مرحباً، أود تقديم طلب جديد من منيو السعادة لاند:\n\n";
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                message += `- ${item.name} (${item.qty}x) = ${Number(item.price) * item.qty} ₪\n`;
                totalPrice += Number(item.price) * item.qty;
            });

            message += `\n*الإجمالي: ${totalPrice} ₪*`;
            const phone = "972590000000"; 
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        loadMenuFromCloud();
    </script>
</body>
</html>
