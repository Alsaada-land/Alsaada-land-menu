<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- خط Tajawal وتنسيقات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #141824;
            --card-border: #22293a;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
        }

        /* رأس الصفحة الفاخر */
        .hero {
            text-align: center;
            padding: 45px 20px 25px;
            background: radial-gradient(circle at top, #1e2638 0%, var(--bg-dark) 70%);
            border-bottom: 1px solid var(--card-border);
            position: relative;
        }

        .logo-badge {
            width: 75px;
            height: 75px;
            background: var(--gold-gradient);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #0a0c10;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.35);
            margin-bottom: 12px;
        }

        .hero h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* أدوات البحث والتصفية */
        .sticky-nav {
            position: sticky;
            top: 0;
            background: rgba(10, 12, 16, 0.92);
            backdrop-filter: blur(12px);
            z-index: 100;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        .search-box {
            position: relative;
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 25px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
        }

        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s;
        }

        .cat-btn.active {
            background: var(--gold-gradient);
            color: #0a0c10;
            font-weight: 700;
            border-color: transparent;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        /* شبكة الأصناف */
        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px 15px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: 0.3s;
        }

        .item-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .item-img-container {
            width: 100%;
            height: 150px;
            overflow: hidden;
            position: relative;
            background: #1a2234;
        }

        .item-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .item-card:hover .item-img {
            transform: scale(1.05);
        }

        .item-content-body {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .item-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
        }

        .item-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .item-price {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--gold);
        }

        .item-price span {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--gold-light);
        }

        .add-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .add-btn:hover, .add-btn:active {
            background: var(--gold-gradient);
            color: #0a0c10;
        }

        /* شريط السلة العائم */
        .cart-bar {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            max-width: 500px;
            margin: auto;
            background: #1a2234;
            border: 1px solid var(--gold);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            display: none;
        }

        .cart-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-badge {
            background: var(--gold-gradient);
            color: #0a0c10;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .cart-total {
            font-weight: 700;
            color: #fff;
        }

        .order-btn {
            background: #25d366;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>

            <button class="cat-btn" onclick="filterCategory('pizza')">البيتزا والكالزوني</button>
            <button class="cat-btn" onclick="filterCategory('desserts')">الحلويات والجاتوهات</button>
            <button class="cat-btn" onclick="filterCategory('drinks')">المشروبات</button>

    </div>

    <main class="container">

    </main>

        </div>

            { id: 115, name: "أيس فانيلا", cat: "drinks", price: 15, desc: "مشروب الفانيلا المثلج", img: "https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=500&auto=format&fit=crop&q=60" },
            { id: 116, name: "أيس كراميل", cat: "drinks", price: 18, desc: "كراميل ماكياتو بارد", img: "https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=500&auto=format&fit=crop&q=60" },
            { id: 117, name: "أيس كراك (فيوجن السعادة)", cat: "drinks", price: 20, desc: "مشروب السعادة البارد المميز", img: "https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=500&auto=format&fit=crop&q=60" },
            { id: 118, name: "سموذي فراولة وموز", cat: "drinks", price: 18, desc: "سموذي طازج بالفراولة والموز", img: "https://images.unsplash.com/photo-1553530666-ba11a7da3888?w=500&auto=format&fit=crop&q=60" },
            { id: 119, name: "سموذي مانجو", cat: "drinks", price: 18, desc: "سموذي مانجو سميك ومنعش", img: "https://images.unsplash.com/photo-1553530666-ba11a7da3888?w=500&auto=format&fit=crop&q=60" },
            { id: 120, name: "سموذي ليمون ونعناع", cat: "drinks", price: 16, desc: "سموذي ليمون ونعناع مثلج", img: "https://images.unsplash.com/photo-1553530666-ba11a7da3888?w=500&auto=format&fit=crop&q=60" },
            { id: 121, name: "مياه كبيرة", cat: "drinks", price: 10, desc: "زجاجة مياه معدنية كبيرة", img: "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=500&auto=format&fit=crop&q=60" },
            { id: 122, name: "مياه صغيرة", cat: "drinks", price: 5, desc: "زجاجة مياه معدنية صغيرة", img: "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=500&auto=format&fit=crop&q=60" }
        ];

        let cart = {};

        // عرض الأصناف
        function renderMenu(items) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            
            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">لا توجد أصناف مطابقة للبحث</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-img-container">
                        <img src="${item.img}" alt="${item.name}" class="item-img" loading="lazy">
                    </div>
                    <div class="item-content-body">
                        <div>
                            <div class="item-header">
                                <div class="item-title">${item.name}</div>
                            </div>
                            <div class="item-desc">${item.desc}</div>
                        </div>
                        <div class="item-footer">
                            <div class="item-price">${item.price} <span>₪</span></div>
                            <button class="add-btn" onclick="addToCart(${item.id})">
                                <i class="fa-solid fa-plus"></i> إضافة
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // تصفية الأقسام
        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (cat === 'all') {
                renderMenu(menuItems);
            } else {
                const filtered = menuItems.filter(item => item.cat === cat);
                renderMenu(filtered);
            }
        }

        // البحث
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = menuItems.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.desc.toLowerCase().includes(query)
            );
            renderMenu(filtered);
        });

        // إدارة السلة
        function addToCart(id) {
            const item = menuItems.find(i => i.id === id);
            if (cart[id]) {
                cart[id].qty++;
            } else {
                cart[id] = { ...item, qty: 1 };
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cartBar');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');
            
            let totalQty = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                totalQty += item.qty;
                totalPrice += item.price * item.qty;
            });

            if (totalQty > 0) {
                cartBar.style.display = 'flex';
                cartCount.innerText = totalQty;
                cartTotal.innerText = `${totalPrice} ₪`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        // إرسال الطلب للواتساب
        function sendWhatsAppOrder() {
            let message = "مرحباً، أود تقديم طلب جديد من منيو السعادة لاند:\n\n";
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                message += `- ${item.name} (${item.qty}x) = ${item.price * item.qty} ₪\n`;
                totalPrice += item.price * item.qty;
            });

            message += `\n*الإجمالي: ${totalPrice} ₪*`;

            const phone = "972590000000"; 
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        // البدء بالتحميل
        renderMenu(menuItems);
    </script>
</body>
</html>
