<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو السعادة لاند | الفخامة والتميز</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #141824;
            --card-border: #22293a;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }
        
        /* زر الأدمن */
        .admin-trigger { position: absolute; top: 15px; left: 15px; background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: var(--gold); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 200; transition: 0.3s; }
        .admin-trigger:hover { background: var(--gold); color: #0a0c10; }

        .hero { text-align: center; padding: 45px 20px 25px; background: radial-gradient(circle at top, #1e2638 0%, var(--bg-dark) 70%); border-bottom: 1px solid var(--card-border); position: relative; }
        .logo-badge { width: 75px; height: 75px; background: var(--gold-gradient); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; color: #0a0c10; box-shadow: 0 0 25px rgba(212, 175, 55, 0.35); margin-bottom: 12px; overflow: hidden; padding: 0; }
        .logo-badge img { width: 100%; height: 100%; object-fit: cover; }
        
        .hero h1 { font-size: 1.8rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .hero p { color: var(--text-muted); font-size: 0.95rem; }
        
        .sticky-nav { position: sticky; top: 0; background: rgba(10, 12, 16, 0.92); backdrop-filter: blur(12px); z-index: 100; padding: 12px 15px; border-bottom: 1px solid rgba(212, 175, 55, 0.15); }
        .search-box { position: relative; margin-bottom: 10px; }
        .search-box input { width: 100%; padding: 10px 40px 10px 15px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 25px; color: #fff; font-size: 0.9rem; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); }
        
        .categories-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 7px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; white-space: nowrap; cursor: pointer; transition: 0.3s; }
        .cat-btn.active { background: var(--gold-gradient); color: #0a0c10; font-weight: 700; border-color: transparent; box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3); }
        
        .container { max-width: 900px; margin: auto; padding: 20px 15px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .item-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        .item-card:hover { border-color: rgba(212, 175, 55, 0.4); transform: translateY(-2px); }
        
        .item-img-container { width: 100%; height: 150px; overflow: hidden; position: relative; background: #1a2234; display: flex; align-items: center; justify-content: center; }
        .item-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s ease; }
        
        .item-content-body { padding: 14px 16px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .item-title { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .item-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 15px; }
        .item-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .item-price { font-size: 1.15rem; font-weight: 900; color: var(--gold); }
        .item-price span { font-size: 0.85rem; font-weight: 500; color: var(--gold-light); }
        .add-btn { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: var(--gold-light); padding: 6px 14px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .add-btn:hover { background: var(--gold-gradient); color: #0a0c10; }

        /* سلة الطلبات */
        .cart-bar { position: fixed; bottom: 15px; left: 15px; right: 15px; max-width: 500px; margin: auto; background: #1a2234; border: 1px solid var(--gold); border-radius: 20px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); z-index: 1000; display: none; }
        .cart-details { display: flex; align-items: center; gap: 12px; }
        .cart-badge { background: var(--gold-gradient); color: #0a0c10; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        .cart-total { font-weight: 700; color: #fff; }
        .order-btn { background: #25d366; color: #fff; border: none; padding: 8px 18px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }

        /* لوحة التحكم للأدمن */
        .admin-input { width: 100%; padding: 8px 12px; background: #0a0c10; border: 1px solid var(--card-border); border-radius: 8px; color: #fff; font-size: 0.9rem; margin-bottom: 8px; outline: none; }
        .admin-input:focus { border-color: var(--gold); }
        .btn-edit { background: #25d366; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.8rem; flex: 1; }
        .btn-delete { background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.8rem; }
        .add-item-card { background: var(--card-bg); border: 2px dashed var(--gold); padding: 15px; border-radius: 16px; margin-bottom: 20px; display: none; }
        
        /* أداة التحكم بتعديل وتحريك الصورة */
        .img-adjuster { background: #0d1117; padding: 8px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--card-border); font-size: 0.8rem; color: var(--text-muted); }
        .img-adjuster label { display: block; margin-bottom: 2px; color: var(--gold-light); }
        .img-adjuster input[type="range"] { width: 100%; accent-color: var(--gold); }
    </style>
</head>
<body>

    <header class="hero">
        <div class="admin-trigger" onclick="checkAdminLogin()" title="لوحة التحكم">
            <i class="fa-solid fa-lock" id="lockIcon"></i>
        </div>
        <div class="logo-badge">
            <img src="logo.jpg" alt="شعار السعادة لاند">
        </div>
        <h1>مطعم السعادة لاند</h1>
        <p>تجربة طعام فاخرة تجمع الأصالة والمذاق الرفيع</p>
    </header>

    <main class="container">
        <!-- إضافة طبق جديد مع رفع صورة من الاستوديو وتعديلها -->
        <div class="add-item-card" id="addItemSection">
            <h3 style="color: var(--gold); margin-bottom: 10px;"><i class="fa-solid fa-plus-circle"></i> إضافة طبق جديد مع صورة من الاستوديو</h3>
            <input type="text" id="newName" class="admin-input" placeholder="اسم الطبق">
            <input type="number" id="newPrice" class="admin-input" placeholder="السعر (₪)">
            <select id="newCat" class="admin-input">
                <option value="shawarma">الشاورما</option>
                <option value="oriental">المأكولات الشرقية</option>
                <option value="western">الوجبات الغربية</option>
                <option value="bbq">وجبات المشاوي</option>
                <option value="appetizers">المقبلات والصلصات</option>
                <option value="pizza">بيتزا وكالزوني</option>
                <option value="desserts">الحلويات</option>
                <option value="drinks">المشروبات</option>
            </select>
            <input type="text" id="newDesc" class="admin-input" placeholder="وصف الطبق">
            
            <div style="margin-bottom: 8px;">
                <label style="font-size: 0.85rem; color: var(--gold);">اختر صورة من الاستوديو:</label>
                <input type="file" id="newImageFile" class="admin-input" accept="image/*" onchange="previewNewImage(event)">
            </div>
            
            <div style="text-align: center; margin-bottom: 10px; background: #0a0c10; padding: 10px; border-radius: 8px;">
                <div style="width: 100px; height: 100px; margin: auto; overflow: hidden; border-radius: 50%; border: 2px solid var(--gold); position: relative; background: #141824;">
                    <img id="newImgPreview" src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
            </div>

            <button style="background: var(--gold-gradient); color: #0a0c10; font-weight: 700; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer;" onclick="addNewItem()">إضافة الطبق للقائمة</button>
        </div>

        <div class="sticky-nav" style="border-radius: 15px; margin-bottom: 20px;">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن وجبتك المفضلة...">
            </div>
            <div class="categories-scroll">
                <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
                <button class="cat-btn" onclick="filterCategory('shawarma', this)">الشاورما</button>
                <button class="cat-btn" onclick="filterCategory('oriental', this)">المأكولات الشرقية</button>
                <button class="cat-btn" onclick="filterCategory('western', this)">الوجبات الغربية</button>
                <button class="cat-btn" onclick="filterCategory('bbq', this)">وجبات المشاوي</button>
                <button class="cat-btn" onclick="filterCategory('appetizers', this)">المقبلات والصلصات</button>
                <button class="cat-btn" onclick="filterCategory('pizza', this)">بيتزا وكالزوني</button>
                <button class="cat-btn" onclick="filterCategory('desserts', this)">الحلويات</button>
                <button class="cat-btn" onclick="filterCategory('drinks', this)">المشروبات</button>
            </div>
        </div>

        <div class="menu-grid" id="menuGrid">
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">جاري تحميل الأصناف السحابية...</div>
        </div>
    </main>

    <div class="cart-bar" id="cartBar">
        <div class="cart-details">
            <div class="cart-badge" id="cartCount">0</div>
            <div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">المجموع الكلي</div>
                <div class="cart-total" id="cartTotal">0 ₪</div>
            </div>
        </div>
        <button class="order-btn" onclick="sendWhatsAppOrder()">
            <i class="fa-brands fa-whatsapp"></i> اطلب الآن
        </button>
    </div>

    <!-- جافاسكريبت وربط Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA0P7gSQu2rl5ZWwcXPrHedsL2OfmY3Cdk",
          authDomain: "alsaada-menu.firebaseapp.com",
          projectId: "alsaada-menu",
          storageBucket: "alsaada-menu.firebasestorage.app",
          messagingSenderId: "632486772624",
          appId: "1:632486772624:web:751938c5b1914cc8e2fd15",
          measurementId: "G-5NRCS5NN6N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let menuItems = [];
        let cart = {};
        let isAdminLoggedIn = false;
        let newUploadedImageBase64 = "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500";

        // رفع وتعديل معاينة صورة الإضافة الجديدة
        window.previewNewImage = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    newUploadedImageBase64 = e.target.result;
                    document.getElementById('newImgPreview').src = newUploadedImageBase64;
                }
                reader.readAsDataURL(file);
            }
        }

        // تسجيل الدخول كأدمن
        window.checkAdminLogin = function() {
            if (isAdminLoggedIn) {
                if (confirm("هل تريد تسجيل الخروج من لوحة التحكم؟")) {
                    isAdminLoggedIn = false;
                    document.getElementById('addItemSection').style.display = 'none';
                    document.getElementById('lockIcon').className = "fa-solid fa-lock";
                    renderMenu(menuItems);
                }
                return;
            }

            let u = prompt("أدخل اسم المستخدم (Username):");
            if (u !== "zeko") { if (u !== null) alert("اسم المستخدم خطأ!"); return; }
            let p = prompt("أدخل كلمة المرور (Password):");
            if (p === "zeko@2001") {
                isAdminLoggedIn = true;
                document.getElementById('addItemSection').style.display = 'block';
                document.getElementById('lockIcon').className = "fa-solid fa-unlock-keyhole";
                alert("تم تسجيل الدخول بنجاح!");
                renderMenu(menuItems);
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        async function loadMenuFromCloud() {
            try {
                const querySnapshot = await getDocs(collection(db, "menu"));
                menuItems = [];
                querySnapshot.forEach((docSnap) => {
                    menuItems.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderMenu(menuItems);
            } catch (error) {
                console.error(error);
            }
        }

        window.renderMenu = function(items) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">لا توجد أصناف متاحة حالياً</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';

                let zoomVal = item.zoom || 1;
                let posXVal = item.posX || 0;
                let posYVal = item.posY || 0;

                let adminControlsHTML = '';
                if (isAdminLoggedIn) {
                    adminControlsHTML = `
                        <div style="background: #1a2234; padding: 12px; border-top: 1px solid var(--card-border); margin-top: 10px;">
                            <input type="text" id="name_${item.id}" class="admin-input" value="${item.name}" placeholder="الاسم">
                            <input type="number" id="price_${item.id}" class="admin-input" value="${item.price}" placeholder="السعر">
                            
                            <div style="margin-bottom: 8px;">
                                <label style="font-size:0.75rem; color:var(--gold);">تغيير صورة الطبق من الاستوديو:</label>
                                <input type="file" id="file_${item.id}" class="admin-input" accept="image/*" onchange="updateItemImageFile(event, '${item.id}')">
                            </div>

                            <!-- أداة التحكم بتكبير وتحريك الصورة (يميناً، يساراً، فوق، تحت) -->
                            <div class="img-adjuster">
                                <label>تكبير/تصغير الصورة (Zoom): <span id="zoom_val_${item.id}">${zoomVal}</span></label>
                                <input type="range" min="1" max="2.5" step="0.1" value="${zoomVal}" oninput="adjustImageProp('${item.id}', 'zoom', this.value)">
                                
                                <label style="margin-top: 5px;">تحريك أفقي (يمين/يسار):</label>
                                <input type="range" min="-100" max="100" value="${posXVal}" oninput="adjustImageProp('${item.id}', 'x', this.value)">

                                <label style="margin-top: 5px;">تحريك عمودي (فوق/تحت):</label>
                                <input type="range" min="-100" max="100" value="${posYVal}" oninput="adjustImageProp('${item.id}', 'y', this.value)">
                            </div>

                            <div style="display: flex; gap: 5px; margin-top: 5px;">
                                <button class="btn-edit" onclick="updateItemData('${item.id}')"><i class="fa-solid fa-save"></i> حفظ التعديلات</button>
                                <button class="btn-delete" onclick="deleteItem('${item.id}')"><i class="fa-solid fa-trash"></i> حذف</button>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="item-img-container">
                        <img id="img_view_${item.id}" src="${item.img || 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500'}" alt="${item.name}" class="item-img" style="transform: scale(${zoomVal}) translate(${posXVal}px, ${posYVal}px);">
                    </div>
                    <div class="item-content-body">
                        <div>
                            <div class="item-title">${item.name}</div>
                            <div class="item-desc">${item.desc || ''}</div>
                        </div>
                        <div class="item-footer">
                            <div class="item-price">${item.price} <span>₪</span></div>
                            <button class="add-btn" onclick="window.addToCart('${item.id}')">
                                <i class="fa-solid fa-plus"></i> إضافة
                            </button>
                        </div>
                        ${adminControlsHTML}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // تفاعلات السلايدر للتعديل الفوري لشكل الصورة
        window.adjustImageProp = function(id, type, val) {
            let imgEl = document.getElementById(`img_view_${id}`);
            let item = menuItems.find(i => i.id === id);
            if(!item) return;

            if(type === 'zoom') item.zoom = Number(val);
            if(type === 'x') item.posX = Number(val);
            if(type === 'y') item.posY = Number(val);

            imgEl.style.transform = `scale(${item.zoom || 1}) translate(${item.posX || 0}px, ${item.posY || 0}px)`;
        }

        // رفع صورة جديدة للكارت القائم من الاستوديو
        let tempUpdatedImages = {};
        window.updateItemImageFile = function(event, id) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempUpdatedImages[id] = e.target.result;
                    document.getElementById(`img_view_${id}`).src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        // حفظ تعديلات الكارت (اسم، سعر، إحداثيات الصورة) في فايربيس
        window.updateItemData = async function(id) {
            let newName = document.getElementById(`name_${id}`).value;
            let newPrice = document.getElementById(`price_${id}`).value;
            let item = menuItems.find(i => i.id === id);

            let updatePayload = {
                name: newName,
                price: Number(newPrice),
                zoom: item.zoom || 1,
                posX: item.posX || 0,
                posY: item.posY || 0
            };

            if(tempUpdatedImages[id]) {
                updatePayload.img = tempUpdatedImages[id];
            }

            try {
                await updateDoc(doc(db, "menu", id), updatePayload);
                alert("تم حفظ التعديلات وتحديثها لدى جميع الزبائن بنجاح!");
                loadMenuFromCloud();
            } catch (err) {
                alert("حدث خطأ أثناء الحفظ");
            }
        }

        // حذف صنف
        window.deleteItem = async function(id) {
            if (!confirm("هل أنت متأكد من حذف هذا الطبق؟")) return;
            try {
                await deleteDoc(doc(db, "menu", id));
                alert("تم الحذف بنجاح!");
                loadMenuFromCloud();
            } catch (err) {
                alert("خطأ أثناء الحذف");
            }
        }

        // إضافة طبق جديد مع رفع الصورة من الاستوديو
        window.addNewItem = async function() {
            let name = document.getElementById('newName').value;
            let price = document.getElementById('newPrice').value;
            let cat = document.getElementById('newCat').value;
            let desc = document.getElementById('newDesc').value;
            
            if (!name || !price) { alert("الرجاء إدخال اسم الطبق والسعر على الأقل!"); return; }
            try {
                await addDoc(collection(db, "menu"), {
                    name,
                    price: Number(price),
                    cat,
                    desc,
                    img: newUploadedImageBase64,
                    zoom: 1,
                    posX: 0,
                    posY: 0
                });
                alert("تمت إضافة الطبق بنجاح!");
                document.getElementById('newName').value = '';
                document.getElementById('newPrice').value = '';
                document.getElementById('newDesc').value = '';
                loadMenuFromCloud();
            } catch (err) {
                alert("خطأ أثناء الإضافة");
            }
        }

        window.filterCategory = function(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (cat === 'all') {
                renderMenu(menuItems);
            } else {
                renderMenu(menuItems.filter(item => item.cat === cat));
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            renderMenu(menuItems.filter(item => item.name.toLowerCase().includes(query)));
        });

        window.addToCart = function(id) {
            const item = menuItems.find(i => i.id == id);
            if (!item) return;
            if (cart[id]) { cart[id].qty++; } else { cart[id] = { ...item, qty: 1 }; }
            updateCartUI();
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cartBar');
            let totalQty = 0, totalPrice = 0;
            Object.values(cart).forEach(item => {
                totalQty += item.qty;
                totalPrice += Number(item.price) * item.qty;
            });
            if (totalQty > 0) {
                cartBar.style.display = 'flex';
                document.getElementById('cartCount').innerText = totalQty;
                document.getElementById('cartTotal').innerText = `${totalPrice} ₪`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        window.sendWhatsAppOrder = function() {
            let message = "مرحباً، أود طلب الأطباق التالية من السعادة لاند:\n\n";
            let totalPrice = 0;
            Object.values(cart).forEach(item => {
                message += `- ${item.name} (${item.qty}x) = ${Number(item.price) * item.qty} ₪\n`;
                totalPrice += Number(item.price) * item.qty;
            });
            message += `\n*الإجمالي الكلي: ${totalPrice} ₪*`;
            window.open(`https://wa.me/972590000000?text=${encodeURIComponent(message)}`, '_blank');
        }

        loadMenuFromCloud();
    </script>
</body>
